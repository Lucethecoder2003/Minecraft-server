---
# roles/minecraft/tasks/main.yml

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
    state: present

# ── Docker Installation ─────────────────────────────────────────────────────

- name: Create Docker GPG keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker
  # ansible_distribution_release = 'noble' on Ubuntu 24.04

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

# ── Minecraft Data Directory ────────────────────────────────────────────────

- name: Create Minecraft data directory
  ansible.builtin.file:
    path: "{{ minecraft_data_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

# ── Systemd Service ─────────────────────────────────────────────────────────

- name: Deploy Minecraft systemd service file
  ansible.builtin.template:
    src: minecraft.service.j2
    dest: /etc/systemd/system/minecraft.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers to apply systemd reload
  ansible.builtin.meta: flush_handlers

- name: Enable Minecraft service (auto-start on reboot)
  ansible.builtin.systemd:
    name: minecraft
    enabled: true
    daemon_reload: true

# ── Pull Docker Image & Start Container ────────────────────────────────────

- name: Pull itzg/minecraft-server Docker image
  community.docker.docker_image:
    name: itzg/minecraft-server
    tag: "{{ minecraft_version }}"
    source: pull
  register: image_pull

- name: Start Minecraft service
  ansible.builtin.systemd:
    name: minecraft
    state: started
  when: image_pull is not failed

- name: Wait for Minecraft port to become open (up to 3 min)
  ansible.builtin.wait_for:
    port: "{{ minecraft_port }}"
    host: "{{ ansible_host }}"
    delay: 10
    timeout: 180
